<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>即刻轻盘</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M17.5 17H9a4 4 0 1 1 3.8-5.2A3 3 0 0 1 17.5 17Z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <meta name="description" content="基于百度网盘青春版的极简文件中转站，支持文件夹浏览与安全下载。源自：如有乐享">
  <link rel="stylesheet" href="/app.css">
</head>

<body>
  <div id="login-overlay" hidden aria-hidden="true">
    <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <span class="login-mark" data-icon="shield-lock" aria-hidden="true"></span>
      <h2 id="login-title">验证访问权限</h2>
      <p>该网盘已开启访问保护，输入访问令牌即可浏览和下载文件。</p>
      <form id="login-form" novalidate>
        <label for="login-token">访问令牌</label>
        <div class="input-wrap">
          <span class="input-icon" data-icon="key-round" aria-hidden="true"></span>
          <input id="login-token" name="access_token" type="password" autocomplete="current-password" required
            placeholder="请输入访问令牌">
        </div>
        <div class="login-actions">
          <button type="submit" id="btn-login" class="btn btn-primary">
            <span class="btn-icon" data-icon="log-in" aria-hidden="true"></span>
            <span class="btn-label">验证并进入</span>
          </button>
        </div>
        <div id="login-error" class="login-error" hidden></div>
      </form>
    </div>
  </div>

  <div class="container" id="app-main">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" data-icon="cloud" aria-hidden="true"></span>
        <div class="brand-text">
          <h1 class="wordmark">即刻轻盘</h1>
          <p class="subtitle">百度网盘青春版 · 安全中转</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost" id="btn-login-open" hidden>
          <span class="btn-icon" data-icon="log-in" aria-hidden="true"></span>
          <span class="btn-label">登录</span>
        </button>
        <button type="button" class="btn btn-ghost" id="btn-logout" hidden>
          <span class="btn-icon" data-icon="log-out" aria-hidden="true"></span>
          <span class="btn-label">退出</span>
        </button>
      </div>
    </header>

    <nav class="breadcrumbs" id="breadcrumbs" aria-label="目录路径"></nav>

    <div class="toolbar">
      <span class="file-count" id="file-count">正在加载列表…</span>
      <div class="toolbar-actions">
        <label class="search-box" for="file-search">
          <span data-icon="search" aria-hidden="true"></span>
          <input id="file-search" type="search" autocomplete="off" placeholder="筛选当前目录" aria-label="筛选当前目录文件">
        </label>
        <button class="btn btn-refresh" id="btn-refresh" type="button">
          <span class="btn-icon" data-icon="refresh-cw" aria-hidden="true"></span>
          <span class="btn-label">刷新</span>
        </button>
      </div>
    </div>

    <div id="list-banner" hidden></div>
    <div id="file-list"></div>

    <div id="status">
      <div class="spinner" data-icon="loader" aria-hidden="true"></div>
      <div class="status-tip">正在加载…</div>
    </div>

    <footer class="footer">
      <a href="https://github.com/malaohu/jikeqingpan" target="_blank" rel="noopener noreferrer">
        <span class="footer-icon" data-icon="github" aria-hidden="true"></span>GitHub
      </a>
      <a href="https://51.ruyo.net" target="_blank" rel="noopener noreferrer">
        <span class="footer-icon" data-icon="sparkles" aria-hidden="true"></span>如有乐享
      </a>
    </footer>
  </div>

  <script src="/icons.js"></script>
  <script src="/app.js"></script>
</body>

</html>
