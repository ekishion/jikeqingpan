<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即刻轻盘</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z' fill='url(%23g)'/%3E%3Cpath d='M13 9L9.5 13.5h2.5V17l3.5-4.5H13V9z' fill='%23ffffff'/%3E%3C/svg%3E">
  <meta name="description" content="基于百度网盘青春版的极简文件中转站，明亮清新，支持文件夹。源自：如有乐享">
  <style>
    /* ===== 设计令牌 (浅色极简) ===== */
    :root {
      --bg: #f9fafb;
      --bg-card: #ffffff;
      --bg-hover: #f3f4f6;
      --accent: #2563eb;
      --accent-light: #3b82f6;
      --accent-glow: rgba(37, 99, 235, 0.06);
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --border: #e5e7eb;
      --danger: #dc2626;
      --success: #16a34a;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      min-height: 100vh;
      padding: 32px 16px 64px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ===== 顶部导航/标题 ===== */
    .header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .header p {
      color: var(--text-secondary);
      margin-top: 4px;
      font-size: 0.9rem;
    }

    /* ===== 面包屑导航 ===== */
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex-wrap: wrap;
    }

    .breadcrumb-item {
      cursor: pointer;
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
    }

    .breadcrumb-item:hover {
      color: var(--accent-light);
      text-decoration: underline;
    }

    .breadcrumb-separator {
      color: #9ca3af;
      user-select: none;
    }

    .breadcrumb-current {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* ===== 工具栏 ===== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }

    .file-count {
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-refresh:hover {
      background: var(--bg-hover);
      border-color: #d1d5db;
    }

    .btn-refresh:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== 文件列表 ===== */
    #file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: background 0.15s, border-color 0.15s;
      cursor: pointer;
      color: inherit;
    }

    .file-item:hover {
      background: var(--bg-hover);
      border-color: #cbd5e1;
    }

    .file-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
      width: 32px;
      text-align: center;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .file-name {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .file-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .file-action {
      flex-shrink: 0;
      padding: 5px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.15s, border-color 0.15s;
    }

    .file-action:hover {
      background: var(--bg-hover);
      border-color: #cbd5e1;
    }

    /* ===== 状态提示 ===== */
    #status {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-msg {
      color: var(--danger);
      padding: 16px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: var(--radius);
      text-align: center;
      font-size: 0.9rem;
    }

    /* ===== Toast 提示 ===== */
    #toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      width: auto;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 1000;
    }

    .toast {
      box-sizing: border-box;
      width: max-content;
      max-width: min(320px, calc(100vw - 32px));
      padding: 9px 15px;
      border: 1px solid #ffffff;
      border-radius: 10px;
      background: #ffffff;
      color: #222222;
      font-size: 0.85rem;
      line-height: 1.45;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: auto;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 12px 56px;
      }

      .header h1 {
        font-size: 1.55rem;
      }

      .breadcrumbs {
        padding: 10px 12px;
        font-size: 0.86rem;
      }

      .toolbar {
        align-items: flex-start;
      }

      .file-item {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        align-items: start;
        justify-items: end;
        gap: 10px 12px;
        padding: 14px 12px;
      }

      .file-icon {
        grid-column: 1;
        grid-row: 1 / 3;
        width: 36px;
        padding-top: 2px;
      }

      .file-info {
        grid-column: 2;
        min-width: 0;
        width: 100%;
      }

      .file-name {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        overflow-wrap: anywhere;
        word-break: break-word;
        line-height: 1.4;
      }

      .file-meta {
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .file-actions {
        grid-column: 2;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }

      .file-action {
        padding: 7px 10px;
        font-size: 0.82rem;
      }

      #toast-container {
        bottom: 16px;
        max-width: calc(100vw - 24px);
      }

      .toast {
        max-width: calc(100vw - 24px);
      }
    }

    /* ===== 底部样式 ===== */
    .footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer a:hover {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 顶部标题 -->
    <header class="header">
      <h1>即刻轻盘</h1>
      <p>极简 · 基于百度网盘青春版中转网盘</p>
    </header>

    <!-- 面包屑路径导航 -->
    <div class="breadcrumbs" id="breadcrumbs">
      <!-- JS 动态填充 -->
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <span class="file-count" id="file-count">正在加载列表…</span>
      <button class="btn-refresh" id="btn-refresh">
        🔄 刷新
      </button>
    </div>

    <!-- 文件列表 -->
    <div id="file-list">
      <!-- JS 动态填充 -->
    </div>

    <!-- 状态提示区 -->
    <div id="status">
      <div class="spinner"></div>
      <div>正在加载文件列表…</div>
    </div>

    <!-- 底部信息 -->
    <footer class="footer">
      <a href="https://github.com/malaohu/jikeqingpan" target="_blank" rel="noopener noreferrer">开源仓库</a>
      <span>|</span>
      <a href="https://51.ruyo.net" target="_blank" rel="noopener noreferrer">作者博客</a>
    </footer>
  </div>

  <!-- 外部脚本 -->
  <script src="/app.js"></script>
</body>

</html>
