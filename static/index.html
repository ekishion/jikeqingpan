<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即刻轻盘</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M7 8h10v2H7V8zm0 4h7v2H7v-2z' fill='white'/%3E%3C/svg%3E">
  <meta name="description" content="基于百度网盘青春版的极简文件中转站，明亮清新，支持文件夹。源自：如有乐享">
  <style>
    /* ===== 设计令牌 (浅色极简) ===== */
    :root {
      --bg: #f9fafb;
      --bg-card: #ffffff;
      --bg-hover: #f3f4f6;
      --accent: #2563eb;
      --accent-light: #3b82f6;
      --accent-glow: rgba(37, 99, 235, 0.06);
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --border: #e5e7eb;
      --danger: #dc2626;
      --success: #16a34a;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      min-height: 100vh;
      padding: 32px 16px 64px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ===== 顶部导航/标题 ===== */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-brand {
      min-width: 0;
      flex: 1;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .header p {
      color: var(--text-secondary);
      margin-top: 4px;
      font-size: 0.9rem;
    }

    /* ===== 面包屑导航 ===== */
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex-wrap: wrap;
    }

    .breadcrumb-item {
      cursor: pointer;
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
    }

    .breadcrumb-item:hover {
      color: var(--accent-light);
      text-decoration: underline;
    }

    .breadcrumb-separator {
      color: #9ca3af;
      user-select: none;
    }

    .breadcrumb-current {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* ===== 工具栏 ===== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }

    .file-count {
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-refresh:hover {
      background: var(--bg-hover);
      border-color: #d1d5db;
    }

    .btn-refresh:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== 文件列表 ===== */
    #file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: background 0.15s, border-color 0.15s;
      cursor: pointer;
      color: inherit;
    }

    .file-item:hover {
      background: var(--bg-hover);
      border-color: #cbd5e1;
    }

    .file-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
      width: 32px;
      text-align: center;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .file-name {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .file-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .file-action {
      flex-shrink: 0;
      padding: 5px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.15s, border-color 0.15s;
    }

    .file-action:hover {
      background: var(--bg-hover);
      border-color: #cbd5e1;
    }

    /* ===== 状态提示 ===== */
    #status {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-msg {
      color: var(--danger);
      padding: 16px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: var(--radius);
      text-align: center;
      font-size: 0.9rem;
    }

    /* ===== Toast 提示 ===== */
    #toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      width: auto;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 1000;
    }

    .toast {
      box-sizing: border-box;
      width: max-content;
      max-width: min(320px, calc(100vw - 32px));
      padding: 9px 15px;
      border: 1px solid #ffffff;
      border-radius: 10px;
      background: #ffffff;
      color: #222222;
      font-size: 0.85rem;
      line-height: 1.45;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: auto;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 12px 56px;
      }

      .header h1 {
        font-size: 1.55rem;
      }

      .breadcrumbs {
        padding: 10px 12px;
        font-size: 0.86rem;
      }

      .toolbar {
        align-items: flex-start;
      }

      .file-item {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        align-items: start;
        justify-items: end;
        gap: 10px 12px;
        padding: 14px 12px;
      }

      .file-icon {
        grid-column: 1;
        grid-row: 1 / 3;
        width: 36px;
        padding-top: 2px;
      }

      .file-info {
        grid-column: 2;
        min-width: 0;
        width: 100%;
      }

      .file-name {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        overflow-wrap: anywhere;
        word-break: break-word;
        line-height: 1.4;
      }

      .file-meta {
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .file-actions {
        grid-column: 2;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }

      .file-action {
        padding: 7px 10px;
        font-size: 0.82rem;
      }

      #toast-container {
        bottom: 16px;
        max-width: calc(100vw - 24px);
      }

      .toast {
        max-width: calc(100vw - 24px);
      }
    }

    /* ===== 底部样式 ===== */
    .footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer a:hover {
      color: var(--accent);
    }
  
    /* ===== Login overlay ===== */
    #login-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
    }
    #login-overlay[hidden] { display: none !important; }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
      padding: 28px 24px 22px;
    }
    .login-card h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      color: #0f172a;
    }
    .login-card p {
      margin: 0 0 18px;
      color: #64748b;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .login-card label {
      display: block;
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 6px;
    }
    .login-card input[type="password"],
    .login-card input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .login-card input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }
    .login-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }
    .login-actions button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      font-weight: 600;
    }
    .login-actions button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .login-error {
      margin-top: 12px;
      color: #dc2626;
      font-size: 0.88rem;
    }
    #list-banner { margin: 0 0 12px; }
    .banner-warning {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .status-error {
      color: #dc2626;
      text-align: center;
      padding: 24px 12px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .btn-logout {
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #475569;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-logout:hover {
      background: #f8fafc;
    }

  </style>
</head>

<body>
  <div id="login-overlay" hidden aria-hidden="true">
    <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <h2 id="login-title">访问验证</h2>
      <p>此实例已启用访问令牌。请输入管理员提供的令牌后继续浏览与下载。</p>
      <form id="login-form">
        <label for="login-token">访问令牌</label>
        <input id="login-token" name="access_token" type="password" autocomplete="current-password" required placeholder="粘贴 access_token">
        <div class="login-actions">
          <button type="submit" id="btn-login">进入网盘</button>
        </div>
        <div id="login-error" class="login-error" hidden></div>
      </form>
    </div>
  </div>

  <div class="container" id="app-main">
    <header class="header">
      <div class="header-brand">
        <h1>☁️ 即刻轻盘</h1>
        <p class="subtitle">百度网盘青春版 · 安全中转</p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-logout" id="btn-login-open" hidden>登录</button>
        <button type="button" class="btn-logout" id="btn-logout" hidden>退出登录</button>
      </div>
    </header>

    <div class="breadcrumbs" id="breadcrumbs"></div>

    <div class="toolbar">
      <span class="file-count" id="file-count">正在加载列表…</span>
      <button class="btn-refresh" id="btn-refresh" type="button">🔄 刷新</button>
    </div>

    <div id="list-banner" hidden></div>
    <div id="file-list"></div>

    <div id="status">
      <div class="spinner"></div>
      <div class="status-tip">正在加载…</div>
    </div>

    <footer class="footer">
      <a href="https://github.com/malaohu/jikeqingpan" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://51.ruyo.net" target="_blank" rel="noopener noreferrer">如有乐享</a>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>

</html>
